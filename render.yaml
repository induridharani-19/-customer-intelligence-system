services:
  - type: web
    name: customer-intelligence-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        sync: false
